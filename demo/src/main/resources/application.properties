spring.application.name=${APP_NAME:collectors-market}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/collectors}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:collectors}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:collectors}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
app.theme=${APP_THEME:artisanal-bids}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
